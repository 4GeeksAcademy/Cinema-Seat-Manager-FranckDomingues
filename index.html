<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-slate-900 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center gap-6 p-6">
      <!-- Header -->
      <header class="text-center">
        <h1 class="text-4xl font-bold tracking-tight text-white">Cinema Seat Manager</h1>
        <p class="mt-2 text-sm text-slate-400">Optional web interface — pick your seat</p>
      </header>

      <!-- Cinema Screen -->
      <div class="w-full max-w-xl rounded-t-lg border-2 border-b-0 border-slate-500 bg-slate-800 px-8 py-3 text-center">
        <span class="text-xs font-semibold tracking-widest text-slate-400 uppercase">SCREEN</span>
      </div>

      <!-- Seat Map Container (will be dynamically rendered in Commit 14) -->
      <div id="seat-map" class="w-full max-w-xl rounded-b-lg border-2 border-t-0 border-slate-500 bg-slate-800/50 p-4">
        <p class="text-center text-sm text-slate-500">Loading seats...</p>
      </div>

      <!-- Legend -->
      <section class="flex gap-6 text-sm" aria-label="Seat legend">
        <div class="flex items-center gap-2">
          <div class="h-5 w-5 rounded border border-slate-500 bg-slate-700"></div>
          <span>Available (L)</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="h-5 w-5 rounded border border-slate-500 bg-amber-600"></div>
          <span>Occupied (X)</span>
        </div>
      </section>

      <!-- Status Panel -->
      <div id="status-message" class="w-full max-w-xl rounded-lg border border-slate-700 bg-slate-800 p-4 text-center text-sm text-slate-400">
        Select a seat to begin.
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
